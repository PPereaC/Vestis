<div class="min-h-screen bg-gray-50 pb-12">
  <nav class="bg-black text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tighter">AdiDAW</h1>
      <div class="text-sm text-gray-400">Tu tienda de confianza</div>
    </div>
  </nav>

  <div class="container mx-auto mt-8 px-4">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Catálogo Oficial</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      <div *ngFor="let item of productos"
        class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col">

        <div class="h-48 bg-gray-200 relative overflow-hidden group">
          <img [src]="item.imagen_url" [alt]="item.nombre"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
        </div>

        <div class="p-4 flex flex-col flex-grow">
          <span class="text-xs font-bold text-gray-500 uppercase mb-1">{{ item.categoria }}</span>
          <h3 class="text-lg font-bold text-gray-900 leading-tight mb-2">{{ item.nombre }}</h3>
          <p class="text-sm text-gray-600 mb-4 flex-grow">{{ item.descripcion }}</p>

          <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
            <span class="text-xl font-black text-gray-900">{{ item.precio }}€</span>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 active:scale-95 transition-all">
              Comprar
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
