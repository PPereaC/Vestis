<div class="grid grid-cols-1 md:grid-cols-[120px_1fr] gap-2 h-190 p-4">

    <div class="flex flex-col gap-4 overflow-y-auto custom-scrollbar p-2 h-full">
        @for (image of images; track $index) {
        <div [ngClass]="[image.color, imageClass]"></div>
        }
    </div>

    <div class="h-full overflow-hidden w-130 pt-2 pb-2">
        <img src="https://picsum.photos/400/300" alt="Imagen" class="object-cover w-full h-full" />
    </div>

</div>
