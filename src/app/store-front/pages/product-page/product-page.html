<div class="grid grid-cols-2 gap-32 p-4">
    <div class="grid grid-cols-1 md:grid-cols-[120px_1fr] gap-2 h-190">

        <div class="flex flex-col gap-4 overflow-y-auto custom-scrollbar p-2 h-full">
            @for (image of imagenesProducto(); track $index) {
            <div [ngClass]="[image, imageClass]"></div>
            }
        </div>

        <div class="h-full overflow-hidden w-130 pt-2 pb-2">
            <img src="{{ portadaProducto() }}" alt="Imagen" class="object-cover w-full h-full" />
        </div>

    </div>

    <div class="pt-4">

        <span class="text-black font-bold text-2xl">{{ producto()?.descripcion }}</span>
